server:
  port: ${SERVER_PORT:8092}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true

spring:
  application:
    name: embabel-stock-agent

  # Spring Boot does not read .env automatically. Import it as a properties file
  # so DEEPRELAY_*, FINNHUB_* and POSTGRES_* placeholders resolve at startup.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/stockagent}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  ai:
    # ---------- Chat model: DeepRelay (OpenAI-compatible API) ----------
    openai:
      base-url: ${DEEPRELAY_BASE_URL:https://api.deeprelay.ai/v1}
      api-key: ${DEEPRELAY_API_KEY:not-set}
      chat:
        model: ${DEEPRELAY_MODEL:deeprelay/deepseek-v4.1-flash}
        temperature: 0.2

    # ---------- Embeddings: local MiniLM via ONNX Transformers (no extra key) ----------
    model:
      embedding: transformers
    embedding:
      transformer:
        cache:
          directory: ${EMBEDDING_CACHE_DIR:data/model-cache}
        tokenizer:
          uri: ${EMBEDDING_TOKENIZER_URI:https://raw.githubusercontent.com/spring-projects/spring-ai/v2.0.2/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json}
        onnx:
          model-uri: ${EMBEDDING_MODEL_URI:https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/tags/v2.0.2/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx}

    # ---------- Durable conversation memory ----------
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    # ---------- pgvector store (384 dimensions = all-MiniLM-L6-v2) ----------
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 384
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        table-name: vector_store
        schema-name: public
        max-document-batch-size: 10000

    # ---------- MCP server: publish analysis goals and stock tools ----------
    mcp:
      server:
        enabled: true
        type: SYNC
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true
      client:
        enabled: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

# ---------- Application settings ----------
app:
  finnhub:
    api-key: ${FINNHUB_API_KEY:not-set}
    base-url: ${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
    timeout: 10s
    cache-ttl: 30s
  yahoo:
    base-url: ${YAHOO_BASE_URL:https://query1.finance.yahoo.com/v8/finance/chart}
    timeout: 10s
    cache-ttl: 5m
  chat:
    memory:
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:40}
  rag:
    top-k: ${RAG_TOP_K:6}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.25}
    chunk-size: ${RAG_CHUNK_SIZE:900}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:120}
  uploads:
    directory: ${UPLOAD_DIR:data/uploads}

embabel:
  models:
    # Custom model registered below; avoids Embabel's built-in gpt-* default.
    default-llm: ${DEEPRELAY_MODEL:deeprelay/deepseek-v4.1-flash}
  agent:
    platform:
      llm-operations:
        prompts:
          default-timeout: 45s
      models:
        openai:
          max-attempts: 1
          backoff-millis: 200
          backoff-multiplier: 1.1
          backoff-max-interval: 1000
          custom:
            base-url: ${DEEPRELAY_BASE_URL:https://api.deeprelay.ai/v1}
            api-key: ${DEEPRELAY_API_KEY:not-set}
            models: ${DEEPRELAY_MODEL:deeprelay/deepseek-v4.1-flash}
            max-attempts: 1
            backoff-millis: 200
      observability:
        capture-message-content: false

logging:
  level:
    com.example.stockagent: INFO
    com.embabel.agent: WARN
