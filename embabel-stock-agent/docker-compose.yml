services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: stockagent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockagent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stockagent-pgdata:/var/lib/postgresql/data
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockagent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockagent-pgdata:
