spring:
  application:
    name: deeprelay-spring-ai
  profiles:
    # Switch the chat/embedding provider with AI_PROVIDER=deeprelay or AI_PROVIDER=azure.
    # The provider-specific settings live in application-deeprelay.yml / application-azure.yml.
    default: ${AI_PROVIDER:deeprelay}
  datasource:
    url: jdbc:h2:file:./data/chat-memory;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    model:
      embedding: transformers
    embedding:
      transformer:
        cache:
          directory: data/model-cache
        tokenizer:
          uri: https://raw.githubusercontent.com/spring-projects/spring-ai/v2.0.2/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json
        onnx:
          model-uri: https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/tags/v2.0.2/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx

chat:
  memory:
    max-messages: ${CHAT_MEMORY_MAX_MESSAGES:80}

rag:
  top-k: ${RAG_TOP_K:4}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.25}
  chunk-size: ${RAG_CHUNK_SIZE:800}
  vector-store-file: ${RAG_VECTOR_STORE_FILE:data/vector-store.json}
  ingest-classpath-docs: ${RAG_INGEST_CLASSPATH_DOCS:true}
  classpath-docs-location: classpath*:knowledge/**/*
  ocr-enabled: ${RAG_OCR_ENABLED:true}
  ocr-language: ${RAG_OCR_LANGUAGE:eng}
  ocr-timeout-seconds: ${RAG_OCR_TIMEOUT_SECONDS:300}
