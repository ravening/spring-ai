server:
  port: ${BANK_PORT:8095}

spring:
  application:
    name: bank-agent
  datasource:
    url: jdbc:h2:file:./data/bank-memory;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    model:
      embedding: transformers
    embedding:
      transformer:
        cache:
          directory: ${BANK_EMBEDDING_CACHE_DIR:data/model-cache}
        tokenizer:
          uri: https://raw.githubusercontent.com/spring-projects/spring-ai/v2.0.2/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json
        onnx:
          model-uri: https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/tags/v2.0.2/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx
    openai:
      base-url: ${DEEPRELAY_BASE_URL:https://api.deeprelay.ai/v1}
      api-key: ${DEEPRELAY_API_KEY}
      chat:
        model: ${DEEPRELAY_MODEL:deeprelay/deepseek-v4.1-flash}
        reasoning-effort: ${DEEPRELAY_REASONING_EFFORT:none}
    mcp:
      server:
        enabled: false
        annotation-scanner:
          enabled: false

bank:
  mcp:
    enabled: ${BANK_MCP_ENABLED:true}
    url: ${BANK_MCP_URL:http://localhost:8096}
    endpoint: ${BANK_MCP_ENDPOINT:/mcp}
    connect-timeout: ${BANK_MCP_CONNECT_TIMEOUT:3s}
    request-timeout: ${BANK_MCP_REQUEST_TIMEOUT:30s}
    retry-cooldown: ${BANK_MCP_RETRY_COOLDOWN:10s}
  chat:
    memory:
      max-messages: ${BANK_CHAT_MEMORY_MAX_MESSAGES:40}
  agents:
    max-revisions: ${BANK_AGENTS_MAX_REVISIONS:2}
  rag:
    enabled: ${BANK_RAG_ENABLED:true}
    top-k: ${BANK_RAG_TOP_K:4}
    similarity-threshold: ${BANK_RAG_SIMILARITY_THRESHOLD:0.25}
    chunk-size: ${BANK_RAG_CHUNK_SIZE:800}
    vector-store-file: ${BANK_RAG_VECTOR_STORE_FILE:data/bank-vector-store.json}
    classpath-docs-location: classpath*:knowledge/**
    uploads-directory: ${BANK_UPLOADS_DIR:data/uploads}

logging:
  level:
    com.example.bank: info
