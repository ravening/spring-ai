server:
  port: ${BANK_PORT:8095}

spring:
  application:
    name: bank-agent
  profiles:
    # Switch the chat provider with AI_PROVIDER=deeprelay or AI_PROVIDER=azure.
    default: ${AI_PROVIDER:deeprelay}
  datasource:
    url: jdbc:h2:file:./data/bank-memory;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    model:
      embedding: transformers
      # Voice models are built by com.example.bank.voice.VoiceConfig from bank.voice.*
      # (DeepRelay does not proxy the OpenAI audio endpoints), so the stock OpenAI
      # audio auto-configurations stay off. The audio endpoint and models are set
      # per provider in the profile files.
      audio:
        speech: none
        transcription: none
    embedding:
      transformer:
        cache:
          directory: ${BANK_EMBEDDING_CACHE_DIR:data/model-cache}
        tokenizer:
          uri: https://raw.githubusercontent.com/spring-projects/spring-ai/v2.0.2/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json
        onnx:
          model-uri: https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/tags/v2.0.2/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx
    mcp:
      server:
        enabled: false
        annotation-scanner:
          enabled: false
  # Temporal durable transfer runs (temporal-durable-agent-poc.md, phase 3). Start the
  # dev server with `temporal server start-dev` (UI on http://localhost:8233).
  temporal:
    connection:
      target: ${TEMPORAL_TARGET:127.0.0.1:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    # SDK 1.41 starts workers on ApplicationReadyEvent and fails startup when the
    # server is unreachable. Set TEMPORAL_START_WORKERS=false to boot without a
    # Temporal server (run submission will then fail with 500 until one is up).
    start-workers: ${TEMPORAL_START_WORKERS:true}
    workers:
      - task-queue: transfer-run
        workflow-classes:
          - com.example.bank.temporal.TransferWorkflowImpl
        activity-beans:
          - transferActivities

bank:
  auth:
    # Demo mode leaves auth off (userId is client-supplied). Any deployment with more
    # than one user MUST set BANK_AUTH_ENABLED=true (and BANK_AUTH_TOKENS) so the
    # verified userId from the bearer token is used for every ownership check.
    enabled: ${BANK_AUTH_ENABLED:false}
    tokens: ${BANK_AUTH_TOKENS:}
  # Scheduled jobs, real transfers and the notification inbox. See
  # tasks/bank-agent-notifications-plan.md. All behaviour is additive.
  jobs:
    enabled: ${BANK_JOBS_ENABLED:true}
    poll-interval: ${BANK_JOBS_POLL_INTERVAL:5s}
    worker-threads: ${BANK_JOBS_WORKER_THREADS:4}
    max-active-per-user: ${BANK_JOBS_MAX_ACTIVE_PER_USER:50}
    max-transfer-amount: ${BANK_JOBS_MAX_TRANSFER_AMOUNT:100}
    default-timezone: ${BANK_JOBS_DEFAULT_TIMEZONE:UTC}
    max-catchup: ${BANK_JOBS_MAX_CATCHUP:100}
    lease-seconds: ${BANK_JOBS_LEASE_SECONDS:60}
  notifications:
    page-size: ${BANK_NOTIFICATIONS_PAGE_SIZE:100}
  rate-limit:
    enabled: ${BANK_RATE_LIMIT_ENABLED:true}
    jobs-per-minute: ${BANK_RATE_LIMIT_JOBS_PER_MINUTE:20}
    transfers-per-minute: ${BANK_RATE_LIMIT_TRANSFERS_PER_MINUTE:30}
    registrations-per-minute: ${BANK_RATE_LIMIT_REGISTRATIONS_PER_MINUTE:20}
  push:
    enabled: ${BANK_PUSH_ENABLED:false}
    url: ${BANK_PUSH_URL:https://exp.host/--/api/v2/push/send}
  mcp:
    enabled: ${BANK_MCP_ENABLED:true}
    url: ${BANK_MCP_URL:http://localhost:8096}
    endpoint: ${BANK_MCP_ENDPOINT:/mcp}
    connect-timeout: ${BANK_MCP_CONNECT_TIMEOUT:3s}
    request-timeout: ${BANK_MCP_REQUEST_TIMEOUT:30s}
    retry-cooldown: ${BANK_MCP_RETRY_COOLDOWN:10s}
  chat:
    memory:
      max-messages: ${BANK_CHAT_MEMORY_MAX_MESSAGES:40}
  agents:
    max-revisions: ${BANK_AGENTS_MAX_REVISIONS:2}
  voice:
    enabled: ${BANK_VOICE_ENABLED:false}
    max-upload-bytes: ${BANK_VOICE_MAX_UPLOAD_BYTES:10485760}
    max-tts-chars: ${BANK_VOICE_MAX_TTS_CHARS:4000}
    audio-dir: ${BANK_VOICE_AUDIO_DIR:data/audio}
  rag:
    enabled: ${BANK_RAG_ENABLED:true}
    top-k: ${BANK_RAG_TOP_K:4}
    similarity-threshold: ${BANK_RAG_SIMILARITY_THRESHOLD:0.25}
    chunk-size: ${BANK_RAG_CHUNK_SIZE:800}
    vector-store-file: ${BANK_RAG_VECTOR_STORE_FILE:data/bank-vector-store.json}
    classpath-docs-location: classpath*:knowledge/**
    uploads-directory: ${BANK_UPLOADS_DIR:data/uploads}
  temporal:
    run:
      task-queue: ${BANK_TEMPORAL_TASK_QUEUE:transfer-run}
      execution-timeout: ${BANK_TEMPORAL_EXECUTION_TIMEOUT:1h}

logging:
  level:
    com.example.bank: info
