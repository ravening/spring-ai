server:
  port: ${AGENT_PORT:8090}

spring:
  application:
    name: agent-demo
  profiles:
    # Switch the chat provider with AI_PROVIDER=deeprelay or AI_PROVIDER=azure.
    default: ${AI_PROVIDER:deeprelay}
  datasource:
    url: jdbc:h2:file:./data/agent-chat-memory;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
      # Keep prompt/completion content out of traces and logs; enable only for a
      # local demo with synthetic data.
      observations:
        log-prompt: false
        log-completion: false
      client:
        observations:
          log-prompt: false
          log-completion: false
    tools:
      observations:
        include-content: false
    model:
      embedding: transformers
    embedding:
      transformer:
        cache:
          directory: ${AGENT_EMBEDDING_CACHE_DIR:data/model-cache}
        tokenizer:
          uri: https://raw.githubusercontent.com/spring-projects/spring-ai/v2.0.2/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json
        onnx:
          model-uri: https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/tags/v2.0.2/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx
    mcp:
      server:
        enabled: false
        annotation-scanner:
          enabled: false
  # Temporal durable agent runs (temporal-durable-agent-poc.md). The dev server is
  # started with `temporal server start-dev`; without a reachable server the app
  # still starts, the worker just retries the connection in the background.
  temporal:
    connection:
      target: ${TEMPORAL_TARGET:127.0.0.1:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    workers:
      - task-queue: agent-run
        workflow-classes:
          - com.example.agent.temporal.AgentRunWorkflowImpl
        activity-beans:
          - agentRunActivities

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 0.2
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

agent:
  mcp:
    enabled: ${AGENT_MCP_ENABLED:true}
    url: ${AGENT_MCP_URL:http://localhost:8091}
    endpoint: ${AGENT_MCP_ENDPOINT:/mcp}
    connect-timeout: ${AGENT_MCP_CONNECT_TIMEOUT:3s}
    request-timeout: ${AGENT_MCP_REQUEST_TIMEOUT:30s}
    retry-cooldown: ${AGENT_MCP_RETRY_COOLDOWN:10s}
  chat:
    memory:
      max-messages: ${AGENT_CHAT_MEMORY_MAX_MESSAGES:40}
  agents:
    max-plan-steps: ${AGENT_MAX_PLAN_STEPS:4}
    parallel: ${AGENT_PARALLEL_STEPS:false}
  rag:
    enabled: ${AGENT_RAG_ENABLED:true}
    top-k: ${AGENT_RAG_TOP_K:4}
    similarity-threshold: ${AGENT_RAG_SIMILARITY_THRESHOLD:0.25}
    chunk-size: ${AGENT_RAG_CHUNK_SIZE:800}
    vector-store-file: ${AGENT_RAG_VECTOR_STORE_FILE:data/agent-vector-store.json}
    classpath-docs-location: classpath*:knowledge/**/*
  temporal:
    demo:
      # Artificial per-step delay used only by the crash demo (scripts/temporal-crash-demo.sh).
      # 0 disables it.
      step-delay: ${AGENT_TEMPORAL_STEP_DELAY:0s}
    run:
      task-queue: ${AGENT_TEMPORAL_TASK_QUEUE:agent-run}
      execution-timeout: ${AGENT_TEMPORAL_EXECUTION_TIMEOUT:2h}
      # Step-level timeouts (start-to-close 5m, heartbeat 15s, max 3 attempts) are set
      # on the activity stub in AgentRunWorkflowImpl.

logging:
  level:
    com.example.agent: info
